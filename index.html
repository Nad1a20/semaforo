<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semáforo — Status</title>
<style>
  :root { --housing: #3a3a3a; --off: #222; }
  body { font-family: system-ui, sans-serif; display: flex; gap: 24px;
         align-items: center; justify-content: center; min-height: 100vh;
         background: #f4f4f4; margin: 0; }
  .badge { background: #e4e4e4; border: 1px solid #bbb; border-radius: 8px;
           padding: 10px 18px; min-width: 220px; }
  .badge small { display: block; color: #555; font-size: 13px; }
  .badge strong { font-size: 28px; }
  .housing { background: var(--housing); border-radius: 24px; padding: 22px;
             display: flex; flex-direction: column; gap: 16px; }
  .luz { width: 110px; height: 110px; border-radius: 50%;
         background: var(--off); border: 3px solid #111; transition: all .2s; }
  .luz.on-green  { background: #22c55e; box-shadow: 0 0 30px #22c55e; }
  .luz.on-yellow { background: #facc15; box-shadow: 0 0 30px #facc15; }
  .luz.on-red    { background: #ef4444; box-shadow: 0 0 30px #ef4444; }
  .offline { color: #b00; }
</style>
</head>
<body>
  <div class="badge">
    <small>Status</small>
    <strong id="status">Conectando…</strong>
    <small id="fuente"></small>
  </div>
  <div class="housing">
    <div class="luz" id="l-green"></div>
    <div class="luz" id="l-yellow"></div>
    <div class="luz" id="l-red"></div>
  </div>
<script>
  // Orden visual igual que el diseño Figma: verde arriba, rojo abajo.
  const NOMBRES = { RED: 'Rojo', GREEN: 'Verde', YELLOW: 'Amarillo' };
  async function actualizar() {
    try {
      const r = await fetch('/api/status');
      const s = await r.json();
      document.getElementById('l-green').className  = 'luz' + (s.light === 'GREEN'  ? ' on-green'  : '');
      document.getElementById('l-yellow').className = 'luz' + (s.light === 'YELLOW' ? ' on-yellow' : '');
      document.getElementById('l-red').className    = 'luz' + (s.light === 'RED'    ? ' on-red'    : '');
      const el = document.getElementById('status');
      if (!s.connected) {
        el.textContent = 'Desconectado';
        el.className = 'offline';
      } else {
        el.className = '';
        el.textContent = `${NOMBRES[s.light] || '—'} · ${s.remaining}s`;
      }
      document.getElementById('fuente').textContent =
        'Fuente: ' + (s.source || '?') + ' · cambio en cuenta regresiva';
    } catch (e) {
      document.getElementById('status').textContent = 'Sin servidor';
    }
  }
  setInterval(actualizar, 500);
  actualizar();
</script>
</body>
</html>
